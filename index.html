<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sekunet · Rumbo al millón</title>
<style>
body{margin:0;background:#0b1d4a;color:#fff;font-family:Arial,Helvetica,sans-serif;text-align:center;overflow:hidden;height:100vh}
#logo{background:#fff;border-radius:16px;padding:10px 24px;display:inline-block;margin-top:5vh}
#logo img{height:110px;display:block}
.t{font-size:44px;color:#9fb3e0;margin:2vh 0 0}
#num{font-size:190px;font-weight:bold;margin:1vh 0;line-height:1.1}
#num .d{color:#ffc93c}
.bar{width:80%;height:26px;margin:0 auto;background:#1d3270;border-radius:13px;overflow:hidden}
#fill{height:100%;width:0;background:#ffc93c;border-radius:13px;transition:width 1.5s}
.lb{width:80%;margin:8px auto 0;display:flex;justify-content:space-between;font-size:26px;color:#9fb3e0}
#falta{font-size:52px;margin-top:3vh}#falta b{color:#ffc93c}
#upd{position:absolute;bottom:12px;left:0;right:0;font-size:18px;color:#5f739e}
#win{display:none;font-size:110px;font-weight:bold;color:#ffc93c;margin-top:2vh}
.p{position:absolute;font-weight:bold;transition:transform 2.5s ease-out,opacity 2.5s ease-out}
.pop{animation:pop .8s}@keyframes pop{0%{transform:scale(1.25);color:#ffc93c}100%{transform:scale(1)}}
</style></head><body>
<div id="logo"><img id="lg" src="logo.png" alt="Sekunet"></div>
<div id="win">¡LLEGAMOS AL MILLÓN!</div>
<div class="t" id="tt">Facturado este mes</div>
<div id="num"><span class="d">$</span><span id="val">993,238</span></div>
<div class="bar"><div id="fill"></div></div>
<div class="lb"><span>$0</span><span id="pct"></span><span>$1,000,000</span></div>
<div id="falta">Faltan <b id="fv"></b> para el millón</div>
<div id="upd"></div>
<script>
var HITO=1000000, cur=0, won=false;
var COLORS=['#ffc93c','#39e0ff','#ffffff','#ff4f9a','#7dff6b','#2f8cff'];
function money(n){return n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});}
function show(total,hora){
  document.getElementById('val').innerHTML=Math.floor(total).toLocaleString('en-US');
  var pct=Math.min(100,total/HITO*100);
  document.getElementById('fill').style.width=pct+'%';
  document.getElementById('pct').innerHTML=pct.toFixed(1)+'% del millón';
  document.getElementById('fv').innerHTML='$'+money(Math.max(0,HITO-total));
  if(hora) document.getElementById('upd').innerHTML='Sincronizado con Odoo · dato de las '+String(hora).slice(11)+' h';
  if(cur>0 && total>cur){ var n=document.getElementById('num'); n.className=''; void n.offsetWidth; n.className='pop'; burst(8,'+$'+money(total-cur)); }
  cur=total;
  if(total>=HITO && !won) celebrate();
}
function piece(txt,x,y,size,color){
  var e=document.createElement('div'); e.className='p'; e.innerHTML=txt;
  e.style.left=x+'px'; e.style.top=y+'px'; e.style.fontSize=size+'px'; e.style.color=color;
  document.body.appendChild(e);
  var a=Math.random()*6.28, d=300+Math.random()*700;
  setTimeout(function(){ e.style.transform='translate('+Math.cos(a)*d+'px,'+Math.sin(a)*d+'px) rotate('+(Math.random()*720-360)+'deg)'; e.style.opacity='0'; },30);
  setTimeout(function(){ if(e.parentNode) e.parentNode.removeChild(e); },2700);
}
function burst(n,txt){
  var W=window.innerWidth,H=window.innerHeight;
  for(var i=0;i<n;i++){ (function(i){ setTimeout(function(){
    piece(txt||['$','1','0','1M','★','✦','●'][Math.floor(Math.random()*7)], W*(.15+Math.random()*.7), H*(.2+Math.random()*.5), txt?34:(30+Math.random()*70), COLORS[Math.floor(Math.random()*COLORS.length)]);
  }, i*60); })(i); }
}
function celebrate(){
  won=true;
  document.getElementById('win').style.display='block';
  document.getElementById('tt').style.display='none';
  document.getElementById('falta').style.display='none';
  document.getElementById('logo').style.marginTop='2vh';
  document.getElementById('lg').style.height='80px';
  document.getElementById('num').style.color='#ffc93c';
  burst(40);
  setInterval(function(){ burst(18); },2500);
}
function tick(){
  var x=new XMLHttpRequest();
  x.open('GET','data.json?t='+Date.now(),true);
  x.onload=function(){ try{ var j=JSON.parse(x.responseText); show(j.total,j.actualizado);}catch(e){} };
  x.send();
}
document.addEventListener('keydown',function(e){ if(e.key==='f'||e.key==='F') celebrate(); });
tick(); setInterval(tick,30000);
</script>
</body></html>
