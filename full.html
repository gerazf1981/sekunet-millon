<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sekunet · Rumbo al millón</title>
<style>
  :root{
    --bg1:#050b1f; --bg2:#0b1d4a; --gold:#ffc93c; --gold2:#ffb000;
    --blue:#2f8cff; --cyan:#39e0ff; --white:#f4f7ff; --muted:#8ea3cf;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{
    font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
    color:var(--white);
    background:radial-gradient(ellipse at 50% 30%, var(--bg2) 0%, var(--bg1) 70%);
  }
  canvas#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
  #flyLayer{position:fixed;inset:0;pointer-events:none;z-index:6;overflow:hidden}
  .grid{
    position:fixed;inset:0;z-index:0;opacity:.18;
    background-image:linear-gradient(rgba(57,224,255,.25) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(57,224,255,.25) 1px,transparent 1px);
    background-size:60px 60px;
    mask-image:radial-gradient(ellipse at center,#000 20%,transparent 75%);
    animation:gridmove 20s linear infinite;
  }
  @keyframes gridmove{to{background-position:60px 60px,60px 60px}}

  main{position:relative;z-index:4;height:100%;display:flex;flex-direction:column;
       align-items:center;justify-content:center;gap:2.2vh;padding:4vh 4vw;text-align:center}
  .brand{background:#fff;border-radius:18px;padding:1.2vh 1.6vw;}
  .brand img{display:block;height:clamp(60px,11vh,130px);width:auto}
  .title{font-size:clamp(22px,3.2vw,56px);font-weight:300;color:var(--muted)}
  .title b{color:var(--white);font-weight:800}

  /* Contador */
  .counter{display:flex;align-items:baseline;justify-content:center;
           font-weight:900;font-variant-numeric:tabular-nums;line-height:1;
           font-size:clamp(56px,11vw,220px);
           text-shadow:0 0 18px rgba(47,140,255,.5)}
  .counter .cur{color:var(--gold);margin-right:.08em;font-size:.75em}
  .slot{position:relative;display:inline-block;width:.62em;height:1.05em;overflow:visible;vertical-align:bottom}
  .slot.sep{width:.3em}
  .slot .d{position:absolute;left:0;right:0;top:0;text-align:center}
  .slot .d.out{animation:flyOut .7s cubic-bezier(.5,-0.4,.7,1) forwards}
  .slot .d.in{animation:dropIn .7s cubic-bezier(.2,1.4,.4,1) forwards}
  @keyframes flyOut{to{transform:translateY(-120%) rotate(-25deg) scale(1.4);opacity:0}}
  @keyframes dropIn{from{transform:translateY(110%) scale(.6);opacity:0}to{transform:none;opacity:1}}
  .cents{font-size:.35em;color:var(--muted);align-self:flex-end;margin-left:.15em;margin-bottom:.12em}

  /* Barra */
  .progress{width:min(1100px,88vw)}
  .bar{position:relative;height:clamp(16px,2.4vh,30px);border-radius:999px;background:rgba(255,255,255,.08);
       border:1px solid rgba(255,255,255,.15);overflow:hidden}
  .fill{position:absolute;inset:0 auto 0 0;width:0;border-radius:999px;
        background:linear-gradient(90deg,var(--blue),var(--cyan),var(--gold));
        box-shadow:0 0 12px rgba(57,224,255,.6);transition:width 1.6s cubic-bezier(.2,.9,.3,1)}
  .fill::after{display:none;content:"";position:absolute;inset:0;
        background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);
        animation:shine 2.2s infinite}
  @keyframes shine{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
  .labels{display:flex;justify-content:space-between;margin-top:1vh;color:var(--muted);
          font-size:clamp(12px,1.3vw,22px)}
  .labels b{color:var(--white)}

  .missing{font-size:clamp(20px,2.6vw,46px);font-weight:300}
  .missing b{color:var(--gold);font-weight:800}

  .stats{display:flex;gap:3vw;flex-wrap:wrap;justify-content:center;color:var(--muted);font-size:clamp(12px,1.2vw,20px)}
  .stats div b{display:block;color:var(--white);font-size:1.6em;font-weight:700}

  footer{position:fixed;bottom:1.5vh;left:0;right:0;z-index:4;display:flex;justify-content:center;gap:1.2em;
         color:#5f739e;font-size:12px}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#2ecc71;margin-right:6px}
  .dot.err{background:#e74c3c;box-shadow:0 0 8px #e74c3c}
  @keyframes pulse{50%{opacity:.3}}
  button.snd{position:fixed;top:16px;right:16px;z-index:10;background:rgba(255,255,255,.08);color:var(--white);
         border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:8px 14px;cursor:pointer;font-size:14px}

  /* Celebración */
  body.won .brand{position:fixed;left:2vw;bottom:2vh;z-index:8;transform:scale(.6);transform-origin:left bottom;transition:.6s}
  body.won .title{opacity:0;transform:translateY(-20px);transition:.6s}
  body.won .missing{display:none}
  .banner{position:fixed;left:0;right:0;top:7vh;z-index:7;text-align:center;pointer-events:none;
          font-weight:900;font-size:clamp(34px,6vw,110px);color:var(--gold);opacity:0;
          text-shadow:0 0 20px rgba(255,201,60,.8)}
  body.won .banner{animation:bannerIn 1.2s 1.6s cubic-bezier(.2,1.5,.4,1) forwards}
  @keyframes bannerIn{from{opacity:0;transform:scale(.2) rotate(-8deg)}to{opacity:1;transform:none}}
  body.won .counter{animation:glowWin 1.4s ease-in-out infinite alternate}
  @keyframes glowWin{to{color:#fff6d6}}
  body.won .counter .cur{color:#fff}
  .flyer{position:absolute;font-weight:900;will-change:transform,opacity;
         text-shadow:0 0 18px rgba(255,201,60,.8)}
  .shake{animation:shake .5s}
  @keyframes shake{20%{transform:translate(-8px,4px)}40%{transform:translate(8px,-4px)}60%{transform:translate(-6px,-3px)}80%{transform:translate(5px,3px)}}
</style>
</head>

<script>
var DPR=1;
/* =================== CONFIGURACIÓN =================== */
const CONFIG = {
  HITO: 1000000,          // el millón
  META_MES: 900000,       // meta del mes (igual que el tablero)
  REFRESCO_SEG: 60,       // cada cuánto consulta Odoo
  // Mismos filtros del pivote "Ventas diarias Sekunet en $ (sin IVA, sin SoniVisión)" del tablero 32.
  // Las fechas se calculan solas para el mes en curso.
  FILTROS_FIJOS: [
    ["move_type","in",["out_invoice","out_refund"]],
    ["state","=","posted"],
    ["commercial_partner_id","not in",[2813,15567,2460,16905,17176]],
    ["company_id","=",1],
    ["currency_id","=",1],
    ["brand_id","not in",[29,32,23]]
  ]
};
/* ====== DATO SINCRONIZADO (se actualiza desde Odoo y se republica) ====== */
const TOTAL_ODOO = 993238.43;
const ACTUALIZADO = "2026-11-27 08:45";
/* ===================================================================== */
const DEMO = location.hash === "#demo";
let demoVal = 992495.53;
async function obtenerTotal(){
  if(DEMO){ demoVal += 1500 + Math.random()*2500; return Math.round(demoVal*100)/100; }
  try{
    const j = await fetch("data.json?t="+Date.now(),{cache:"no-store"}).then(r=>{ if(!r.ok) throw 0; return r.json(); });
    if(j && typeof j.total==="number"){ ultimaHora = j.actualizado || ultimaHora; return j.total; }
  }catch(e){}
  return Math.max(current, TOTAL_ODOO);
}
let ultimaHora = ACTUALIZADO;
const nombreMes = () => new Date().toLocaleDateString("es-CR",{month:"long",year:"numeric"});
function leerPrevio(){ try{ return Number(localStorage.getItem("sk-millon-prev"))||0; }catch(e){ return 0; } }
function guardarPrevio(v){ try{ localStorage.setItem("sk-millon-prev", String(v)); }catch(e){} }

/* =================== CONTADOR CON DÍGITOS QUE VUELAN =================== */
const counterEl = document.getElementById("counter");
let shown = "";
const fmtInt = n => Math.floor(n).toLocaleString("en-US");
const fmtMoney = n => "$" + n.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});

function renderCounter(value, fly=true){
  const intStr = fmtInt(value);
  const cents = "." + (Math.round((value%1)*100)).toString().padStart(2,"0");
  if(counterEl.children.length === 0 || shown.length !== intStr.length){
    counterEl.innerHTML = '<span class="cur">$</span>' +
      [...intStr].map(ch => `<span class="slot${ch===","?" sep":""}"><span class="d in">${ch}</span></span>`).join("") +
      `<span class="cents">${cents}</span>`;
  } else {
    const slots = counterEl.querySelectorAll(".slot");
    [...intStr].forEach((ch,i)=>{
      if(shown[i] !== ch){
        const slot = slots[i];
        if(!fly){ slot.innerHTML = '<span class="d">'+ch+'</span>'; return; }
        const old = slot.querySelector(".d:not(.out)");
        if(old){ old.className = "d out"; setTimeout(()=>old.remove(),750); }
        const nd = document.createElement("span");
        nd.className = "d in"; nd.textContent = ch;
        nd.style.animationDelay = (i*40)+"ms";
        slot.appendChild(nd);
      }
    });
    counterEl.querySelector(".cents").textContent = cents;
  }
  shown = intStr;
}

/* Conteo animado del valor anterior al nuevo */
let current = 0, animFrame;
function animateTo(target, ms=1800){
  cancelAnimationFrame(animFrame);
  const start = current;
  if(start>0){ current = target; renderCounter(target, true); return; }  // solo vuelan los dígitos que cambian
  const t0 = performance.now();
  const step = t => {
    const p = Math.min(1,(t-t0)/ms), e = 1-Math.pow(1-p,4);
    const v = start + (target-start)*e;
    renderCounter(v, false);
    if(p<1) animFrame = requestAnimationFrame(step); else { current = target; renderCounter(target, false); }
  };
  animFrame = requestAnimationFrame(step);
}
function updateUI(total){
  const pct = Math.min(100, total/CONFIG.HITO*100);
  document.getElementById("fill").style.width = pct+"%";
  document.getElementById("pct").textContent = pct.toFixed(1)+"%";
  document.getElementById("falta").textContent = fmtMoney(Math.max(0, CONFIG.HITO-total));
  document.getElementById("meta").textContent = "$"+CONFIG.META_MES.toLocaleString("en-US");
  document.getElementById("cump").textContent = (total/CONFIG.META_MES*100).toFixed(2)+"%";
}

/* =================== FUEGOS ARTIFICIALES =================== */
const cv = document.getElementById("fx"), cx = cv.getContext("2d");
let W,H;  const resize=()=>{W=cv.width=innerWidth;H=cv.height=innerHeight;}; resize(); addEventListener("resize",resize);
const rockets=[], sparks=[];
const COLORS=["#ffc93c","#ffb000","#39e0ff","#2f8cff","#ffffff","#ff4f9a","#7dff6b"];
function launch(x){
  rockets.push({x:(x!=null?x:W*(.15+Math.random()*.7)), y:H, vx:(Math.random()-.5)*2*DPR,
    vy:-(H/55)*(0.85+Math.random()*.3), ty:H*(.12+Math.random()*.35),
    c:COLORS[Math.floor(Math.random()*COLORS.length)]});
  kick();
}
function burst(x,y,c){
  const n = 50+Math.random()*30, type = Math.random();
  for(let i=0;i<n;i++){
    const a = Math.PI*2*i/n, s = (type<.3? 7 : 2+Math.random()*7)*DPR;
    sparks.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,decay:.008+Math.random()*.012,
      c: Math.random()<.25? "#ffffff" : c, size:(1.5+Math.random()*2)*DPR});
  }
  boom();
}
function loop(){
  cx.globalCompositeOperation="destination-out";
  cx.fillStyle="rgba(0,0,0,.22)"; cx.fillRect(0,0,W,H);
  cx.globalCompositeOperation="lighter";
  for(let i=rockets.length-1;i>=0;i--){
    const r=rockets[i]; r.x+=r.vx; r.y+=r.vy; r.vy*=.985;
    cx.fillStyle=r.c; cx.beginPath(); cx.arc(r.x,r.y,2.5*DPR,0,7); cx.fill();
    if(r.y<=r.ty || r.vy>-1){ burst(r.x,r.y,r.c); rockets.splice(i,1); }
  }
  for(let i=sparks.length-1;i>=0;i--){
    const p=sparks[i]; p.x+=p.vx; p.y+=p.vy; p.vx*=.97; p.vy=p.vy*.97+.06*DPR; p.life-=p.decay;
    if(p.life<=0){sparks.splice(i,1);continue;}
    cx.globalAlpha=p.life; cx.fillStyle=p.c; cx.beginPath(); cx.arc(p.x,p.y,p.size,0,7); cx.fill();
  }
  cx.globalAlpha=1;
  if(rockets.length||sparks.length) requestAnimationFrame(loop);
  else { cx.clearRect(0,0,W,H); running=false; }
}
var running=false;
function kick(){ if(!running){ running=true; requestAnimationFrame(loop);} }

/* =================== NÚMEROS VOLANDO =================== */
const fly = document.getElementById("flyLayer");
function flyNumber(txt, opts={}){
  const el = document.createElement("div");
  el.className="flyer"; el.textContent=txt;
  const size = (opts.size!=null?opts.size:(24+Math.random()*60));
  el.style.fontSize = size+"px";
  el.style.color = (opts.color||COLORS[Math.floor(Math.random()*5)]);
  const sx = (opts.x!=null?opts.x:innerWidth/2), sy = (opts.y!=null?opts.y:innerHeight/2);
  el.style.left = sx+"px"; el.style.top = sy+"px";
  fly.appendChild(el);
  const ang = Math.random()*Math.PI*2, dist = 300+Math.random()*Math.max(innerWidth,innerHeight)*.7;
  const dx = Math.cos(ang)*dist, dy = Math.sin(ang)*dist, rot = (Math.random()-.5)*1080;
  el.animate([
    {transform:"translate(-50%,-50%) scale(.2) rotate(0deg)",opacity:0},
    {transform:"translate(-50%,-50%) scale(1.2) rotate(0deg)",opacity:1,offset:.12},
    {transform:`translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(.8) rotate(${rot}deg)`,opacity:0}
  ],{duration:1800+Math.random()*1400,easing:"cubic-bezier(.15,.8,.3,1)",delay:opts.delay||0,fill:"forwards"})
  .onfinish=()=>el.remove();
}
/* Explota los dígitos del contador en pedazos que vuelan */
function explodeCounter(){
  const r = counterEl.getBoundingClientRect();
  counterEl.querySelectorAll(".slot .d:not(.out), .cur").forEach((d,i)=>{
    const b = d.getBoundingClientRect();
    flyNumber(d.textContent,{x:b.left+b.width/2,y:b.top+b.height/2,size:b.height*.9,color:"#ffc93c",delay:i*30});
  });
  counterEl.style.visibility="hidden";
  document.body.classList.add("shake");
  setTimeout(()=>document.body.classList.remove("shake"),600);
  setTimeout(()=>{ counterEl.style.visibility="visible"; counterEl.innerHTML=""; shown=""; renderCounter(current); }, 1400);
}
function numberRain(n=40){
  const pool=["$","1","0","0","0","0","0","0","1M","$1,000,000","💰","🚀","1,000,000"];
  for(let i=0;i<n;i++) setTimeout(()=>flyNumber(pool[Math.floor(Math.random()*pool.length)],{
    x:innerWidth*(.1+Math.random()*.8), y:innerHeight*(.2+Math.random()*.6)}), i*70);
}

/* =================== SONIDO (opcional) =================== */
let actx=null, soundOn=false;
document.getElementById("sndBtn").onclick=()=>{
  if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)();
  soundOn=!soundOn; document.getElementById("sndBtn").textContent = soundOn?"🔊 Sonido activo":"🔇 Activar sonido";
  if(soundOn) note(880,.08,0,.15);
};
function note(f,dur,when=0,vol=.2,type="triangle"){
  if(!soundOn||!actx) return;
  const t=actx.currentTime+when, o=actx.createOscillator(), g=actx.createGain();
  o.type=type; o.frequency.value=f; g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.02);
  g.gain.exponentialRampToValueAtTime(.001,t+dur); o.connect(g).connect(actx.destination); o.start(t); o.stop(t+dur+.05);
}
function boom(){
  if(!soundOn||!actx) return;
  const t=actx.currentTime, len=actx.sampleRate*.5, buf=actx.createBuffer(1,len,actx.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3);
  const s=actx.createBufferSource(), g=actx.createGain(), f=actx.createBiquadFilter();
  f.type="lowpass"; f.frequency.value=600+Math.random()*900; g.gain.value=.25;
  s.buffer=buf; s.connect(f).connect(g).connect(actx.destination); s.start(t);
}
function fanfare(){
  // Fanfarria original: subida en Do mayor y acorde final brillante
  const seq=[[523,0],[659,.15],[784,.3],[1047,.45],[784,.7],[1047,.85]];
  seq.forEach(([f,w])=>note(f,.35,w,.18,"square"));
  [523,659,784,1047,1319].forEach(f=>note(f,1.8,1.1,.09,"sawtooth"));
}

/* =================== CELEBRACIÓN =================== */
let celebrated=false, showTimer=null, ultimaCelebrada=null;
function celebrate(){
  if(celebrated) return; celebrated=true;
  document.body.classList.add("won");
  fanfare();
  explodeCounter();
  for(let i=0;i<8;i++) setTimeout(()=>launch(), 300+i*300);
  setTimeout(()=>numberRain(30), 900);
  // Sigue la fiesta: fuegos y números cada pocos segundos
  showTimer=setInterval(()=>{
    for(let i=0;i<3;i++) setTimeout(()=>launch(), i*400);
    numberRain(8);
  }, 6000);
}
// Atajo para probar en cualquier momento: tecla F
addEventListener("keydown",e=>{ if(e.key==="f"||e.key==="F"){ celebrated=false; clearInterval(showTimer); celebrate(); } });

/* =================== CICLO PRINCIPAL =================== */
let primera = true;
async function tick(){
  const dot=document.getElementById("dot"), st=document.getElementById("status");
  const total = await obtenerTotal();
  let prev = current;
  if(primera && !DEMO){
    const guardado = leerPrevio();
    if(guardado>0 && guardado<total){ prev = guardado; current = guardado; renderCounter(guardado); }
  }
  primera = false;
  animateTo(total, prev===0?2200:1800);
  updateUI(total);
  if(prev>0 && total>prev && total<CONFIG.HITO){
    for(let i=0;i<5;i++) setTimeout(()=>flyNumber("+"+fmtMoney(total-prev),{size:28,x:innerWidth/2,y:innerHeight*.55}), 600+i*120);
    setTimeout(launch,600);
  }
  if(total>=CONFIG.HITO && ultimaHora!==ultimaCelebrada){
    // Cada sincronización después del millón vuelve a lanzar la celebración completa
    ultimaCelebrada = ultimaHora; celebrated=false; clearInterval(showTimer);
    setTimeout(celebrate, 2000);
  }
  if(!DEMO) guardarPrevio(total);
  dot.classList.remove("err");
  st.textContent = DEMO? "Modo demo" : "Sincronizado con Odoo";
  document.getElementById("updated").textContent = DEMO? "" : "Dato de las "+String(ultimaHora).slice(11)+" h";
}
document.getElementById("mes").textContent = nombreMes();
tick();
setInterval(tick, DEMO?4000:30000);
</script>
